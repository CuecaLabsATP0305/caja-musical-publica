<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja Musical Pública - Canal Avanzado</title>
    <style>
        body { background-color: #000; color: #00ff66; font-family: monospace; margin: 0; padding: 15px; overflow: hidden; }
        .master-grid { display: grid; grid-template-columns: 1fr; gap: 15px; height: 93vh; }
        @media(min-width: 992px) { .master-grid { grid-template-columns: 3fr 2fr; } }
        .panel { border: 2px solid #00ff66; background: #030303; padding: 15px; display: flex; flex-direction: column; }
        .canvas-container { flex-grow: 1; border: 1px dashed #00ff66; background: #050505; position: relative; cursor: crosshair; min-height: 350px; }
        .interactive-svg { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        .telemetry-log { font-size: 0.8rem; line-height: 1.5; background: #000; padding: 12px; border: 1px solid #00aa44; height: 100%; overflow-y: auto; color: #66ff99; }
        .btn-engage { background: #00ff66; color: #000; border: none; padding: 15px 30px; font-family: monospace; font-weight: bold; font-size: 1.1rem; cursor: pointer; border-radius: 4px; z-index: 10; position: absolute; top: 45%; left: 25%; }
    </style>
</head>
<body>

    <div class="master-grid">
        <div class="panel">
            <div style="font-size: 1.1rem; margin-bottom: 10px;"><strong>[✓] ATRACTOR QUIRAL FRACTAL DE CONTROL UNIVERSAL (2000 CANALES)</strong></div>
            <div id="navigationPad" class="canvas-container">
                <button id="btnSinapsis" class="btn-engage">SINTONIZAR CANAL CEREBRAL DIRECTO</button>
                <svg id="fractalGiro" class="interactive-svg">
                    <circle cx="50%" cy="50%" r="40" stroke="#00ff66" stroke-width="1" fill="none" opacity="0.3"/>
                    <circle cx="50%" cy="50%" r="80" stroke="#00ff66" stroke-width="1" fill="none" opacity="0.2"/>
                    <circle cx="50%" cy="50%" r="120" stroke="#00ff66" stroke-width="1" fill="none" opacity="0.1"/>
                    <line id="lineaGiro" x1="50%" y1="50%" x2="50%" y2="50%" stroke="#ffff00" stroke-width="2" />
                </svg>
            </div>
        </div>

        <div class="panel">
            <div style="font-size: 1.1rem; margin-bottom: 10px;"><strong>[📡] TELEMETRÍA BI-DIRECCIONAL FLUIDA</strong></div>
            <div id="diagnosticoStream" class="telemetry-log">
                [SISTEMA]: PROCESANDO RESPUESTA DE LA CAJA NEGRA INDUSTRIAL...<br>
                [✓] DISEÑO ARMONIZADO A NIVEL INDUSTRIAL CON LAZO NO LINEAL ACTIVO.<br>
                [PRINCIPIO]: INTEGRIDAD BIOMÉDICA PROTEGIDA (CERO DAÑO).
            </div>
        </div>
    </div>

    <script>
        const matrixTensor = new Int8Array(2000);
        let audioCtx = null, oscillator = null, gainNode = null;
        let lazoConectado = false;

        const navigationPad = document.getElementById('navigationPad');
        const btnSinapsis = document.getElementById('btnSinapsis');
        const diagnosticoStream = document.getElementById('diagnosticoStream');
        const lineaGiro = document.getElementById('lineaGiro');

        function emmitTelemetry(info) {
            const time = new Date().toISOString().slice(11, 19);
            diagnosticoStream.innerHTML += `[${time}] ${info}<br>`;
            diagnosticoStream.scrollTop = diagnosticoStream.scrollHeight;
        }

        btnSinapsis.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!lazoConectado) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                oscillator = audioCtx.createOscillator();
                gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(432, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();

                btnSinapsis.style.display = 'none';
                lazoConectado = true;
                emmitTelemetry("<span style='color:#ffff00;'>[✓] INTERFAZ HOMEOSTÁTICA TOTALMENTE OPERATIVA (+50 AÑOS)</span>");
            }
        });

        function caminarSimulacionNoLineal(clientX, clientY) {
            if (!lazoConectado) return;

            const rect = navigationPad.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            const centroX = rect.width / 2;
            const centroY = rect.height / 2;
            
            const dx = x - centroX;
            const dy = y - centroY;
            const radio = Math.min(Math.sqrt(dx*dx + dy*dy), centroX);
            const angulo = Math.atan2(dy, dx);

            const freqF1 = Math.round(200 + (radio / centroX) * 800);
            const gibbsCalculado = Math.round(Math.sin(angulo) * 127);
            const masterVol = Math.round((y / rect.height) * 127);

            matrixTensor[10] = Math.min(Math.max(masterVol, -128), 127);
            matrixTensor[750] = Math.min(Math.max(gibbsCalculado, -128), 127);

            oscillator.frequency.setValueAtTime(freqF1, audioCtx.currentTime);
            gainNode.gain.setValueAtTime((Math.abs(matrixTensor[10]) / 127) * 0.07, audioCtx.currentTime);

            lineaGiro.setAttribute('x2', `${x}`);
            lineaGiro.setAttribute('y2', `${y}`);

            emmitTelemetry(`Giro Quiral: Radio=${Math.round(radio)} | Angulo=${angulo.toFixed(2)} rad | Freq=${freqF1}Hz | Gibbs=${gibbsCalculado}`);
        }

        navigationPad.addEventListener('mousemove', (e) => {
            caminarSimulacionNoLineal(e.clientX, e.clientY);
        });

        navigationPad.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            caminarSimulacionNoLineal(touch.clientX, touch.clientY);
        }, { passive: false });
    </script>
</body>
</html>
